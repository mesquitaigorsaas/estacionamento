<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clientes/Veículos — Estacionamento</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="icon" href="assets/logo/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/forms.css" />
  <link rel="stylesheet" href="css/tables.css" />
</head>
<body>

  <div class="shell">
    <div id="sidebar-container"></div>

    <div>
      <div id="header-container"></div>

      <main class="conteudo">
        <div class="pagina-titulo">
          <h1>Clientes / Veículos</h1>
          <p>Consulte e edite os dados cadastrados</p>
        </div>

        <div class="cartao">
          <div class="barra-filtros">
            <div class="campo">
              <label for="campo-busca">Buscar por placa ou nome</label>
              <input type="text" id="campo-busca" placeholder="Digite para filtrar..." />
            </div>
          </div>

          <div class="tabela-wrapper">
            <table class="tabela">
              <thead>
                <tr>
                  <th>Placa</th>
                  <th>Nome</th>
                  <th>Contato</th>
                  <th>Modelo/Cor</th>
                  <th>Tipo</th>
                  <th>Ações</th>
                </tr>
              </thead>
              <tbody id="tabela-corpo">
                <!-- preenchido via JS -->
              </tbody>
            </table>
            <div id="mensagem-vazio" class="mensagem-vazio oculto">Nenhum veículo encontrado.</div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <div id="modal-container"></div>

  <script type="module" src="js/clientes.js"></script>
</body>
</html>
