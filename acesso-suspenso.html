<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acesso suspenso — Estacionamento</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/login.css" />
</head>
<body>

  <div class="tela-login">
    <div class="login-caixa" style="text-align: center;">

      <div class="login-topo">
        <img src="assets/logo/logo.png" alt="Logo do estacionamento" class="logo" />
      </div>

      <h2 style="margin-bottom: var(--espaco-3);">Acesso suspenso</h2>

      <p class="texto-suave" style="margin-bottom: var(--espaco-4);">
        O acesso deste estacionamento está temporariamente suspenso, provavelmente por
        pendência na assinatura. Entre em contato com o suporte para regularizar e
        voltar a usar o sistema normalmente.
      </p>

      <!--
        Troque o href abaixo por um link de WhatsApp de suporte, se quiser
        (formato: https://wa.me/55DDDNUMERO), ou apaga esse botão se preferir
        que a pessoa entre em contato por outro canal.
      -->
      <a href="index.html" class="btn btn-secundario btn-bloco">Voltar para o login</a>

    </div>
  </div>

</body>
</html>
