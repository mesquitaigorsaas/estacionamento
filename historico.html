<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Histórico — Estacionamento</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/forms.css" />
  <link rel="stylesheet" href="css/tables.css" />
</head>
<body>

  <div class="shell">
    <div id="sidebar-container"></div>

    <div>
      <div id="header-container"></div>

      <main class="conteudo">
        <div class="pagina-titulo">
          <h1>Histórico</h1>
          <p>Todas as movimentações de entrada e saída</p>
        </div>

        <div class="cartao">
          <div class="barra-filtros">
            <div class="campo">
              <label for="filtro-placa">Placa</label>
              <input type="text" id="filtro-placa" placeholder="Todas" />
            </div>
            <div class="campo">
              <label for="filtro-status">Status</label>
              <select id="filtro-status">
                <option value="">Todos</option>
                <option value="aberta">Em aberto</option>
                <option value="finalizada">Finalizada</option>
              </select>
            </div>
            <div class="campo">
              <label for="filtro-campo-data">Data por</label>
              <select id="filtro-campo-data">
                <option value="entrada">Entrada</option>
                <option value="saida">Saída</option>
              </select>
            </div>
            <div class="campo">
              <label for="filtro-data-inicio">De</label>
              <input type="date" id="filtro-data-inicio" />
            </div>
            <div class="campo">
              <label for="filtro-data-fim">Até</label>
              <input type="date" id="filtro-data-fim" />
            </div>
            <button id="btn-filtrar" class="btn btn-secundario">Filtrar</button>
          </div>

          <div class="tabela-wrapper">
            <table class="tabela">
              <thead>
                <tr>
                  <th>Placa</th>
                  <th>Nome</th>
                  <th>Entrada</th>
                  <th>Saída</th>
                  <th>Duração</th>
                  <th>Valor</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody id="tabela-corpo"></tbody>
            </table>
            <div id="mensagem-vazio" class="mensagem-vazio oculto">Nenhuma movimentação encontrada.</div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script type="module" src="js/historico.js"></script>
</body>
</html>
