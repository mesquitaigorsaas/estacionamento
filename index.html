<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Estacionamento — Entrar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/login.css" />
</head>
<body>

  <div class="tela-login">
    <div class="login-caixa">

      <div class="login-topo">
        <img src="assets/logo/logo.png" alt="Logo do estacionamento" class="logo" />
        <p>Acesse sua conta para continuar</p>
      </div>

      <!-- ============== LOGIN DE FUNCIONÁRIO ============== -->
      <form id="form-login">
        <div id="login-erro" class="login-erro oculto"></div>

        <div class="campo">
          <label for="login-usuario">Usuário</label>
          <input type="text" id="login-usuario" name="usuario" autocomplete="username" required />
        </div>

        <div class="campo">
          <label for="login-senha">Senha</label>
          <div class="campo-senha-wrapper">
            <input type="password" id="login-senha" name="senha" autocomplete="current-password" required />
            <button type="button" id="btn-mostrar-senha">Mostrar</button>
          </div>
        </div>

        <div class="login-links">
          <a href="#" id="link-esqueci-senha">Esqueci minha senha</a>
        </div>

        <button type="submit" id="btn-entrar" class="btn btn-primario btn-bloco">Entrar</button>
      </form>

    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
