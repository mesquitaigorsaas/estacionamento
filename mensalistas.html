<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mensalistas — Estacionamento</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="icon" href="assets/logo/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/forms.css" />
  <link rel="stylesheet" href="css/tables.css" />
  <link rel="stylesheet" href="css/modal.css" />
</head>
<body>

  <div class="shell">
    <div id="sidebar-container"></div>

    <div>
      <div id="header-container"></div>

      <main class="conteudo">
        <div class="pagina-titulo">
          <h1>Mensalistas</h1>
          <p>Cadastre novos planos e acompanhe os existentes</p>
        </div>

        <!-- ============== CADASTRAR NOVA MENSALIDADE ============== -->
        <div class="cartao" style="margin-bottom: var(--espaco-4);">
          <h3 style="margin-bottom: var(--espaco-3);">Nova mensalidade</h3>

          <form id="form-busca" class="form-busca-placa">
            <div class="campo">
              <label for="campo-placa">Placa</label>
              <input type="text" id="campo-placa" maxlength="8" placeholder="ABC1D23" required />
            </div>
            <button type="submit" class="btn btn-secundario">Consultar</button>
          </form>

          <div id="aviso" class="login-erro oculto"></div>

          <div id="bloco-mensalidade" class="oculto">
            <div class="grade-form grade-form-3col" style="margin-bottom: var(--espaco-3);">
              <div class="campo campo-cliente">
                <label for="novo-nome">Nome completo</label>
                <input type="text" id="novo-nome" />
              </div>
              <div class="campo campo-cliente">
                <label for="novo-contato">Telefone</label>
                <input type="tel" id="novo-contato" />
              </div>
              <div class="campo campo-cliente">
                <label for="novo-modelo">Modelo</label>
                <input type="text" id="novo-modelo" />
              </div>
              <div class="campo campo-cliente">
                <label for="novo-cor">Cor</label>
                <input type="text" id="novo-cor" />
              </div>
              <div class="campo">
                <label for="campo-valor">Valor mensal (R$)</label>
                <input type="number" id="campo-valor" step="0.01" min="0" required />
              </div>
              <div class="campo">
                <label>Vencimento</label>
                <div class="info-valor" id="texto-vencimento" style="padding-top:8px;">—</div>
              </div>
            </div>
            <button id="btn-cadastrar-mensalidade" class="btn btn-primario">Cadastrar mensalidade</button>
          </div>
        </div>

        <!-- ============== LISTA DE MENSALISTAS ============== -->
        <div class="cartao">
          <h3 style="margin-bottom: var(--espaco-3);">Mensalistas ativos</h3>
          <div class="tabela-wrapper">
            <table class="tabela">
              <thead>
                <tr>
                  <th>Placa</th>
                  <th>Nome</th>
                  <th>Valor</th>
                  <th>Vencimento</th>
                  <th>Status</th>
                  <th>Ações</th>
                </tr>
              </thead>
              <tbody id="tabela-corpo"></tbody>
            </table>
            <div id="mensagem-vazio" class="mensagem-vazio oculto">Nenhuma mensalidade cadastrada.</div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <div id="modal-container"></div>

  <script type="module" src="js/mensalistas.js"></script>
</body>
</html>
