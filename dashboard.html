<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Início — Estacionamento</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
</head>
<body>

  <div class="shell">
    <div id="sidebar-container"></div>

    <div>
      <div id="header-container"></div>

      <main class="conteudo">
        <h1>Visão geral</h1>
        <p class="texto-suave" style="margin-bottom: var(--espaco-4);">Resumo da operação de hoje</p>

        <!-- Cada cartão leva para a tela correspondente, já filtrada.
             O "hoje" no endereço é resolvido por js/utils/parametros.js. -->
        <div class="grade-indicadores">
          <a class="indicador" href="historico.html?status=aberta">
            <div class="indicador-rotulo">Veículos estacionados</div>
            <div class="indicador-valor" id="ind-estacionados">—</div>
            <div class="indicador-link">Ver no pátio →</div>
          </a>
          <a class="indicador" href="historico.html?campo=entrada&amp;de=hoje&amp;ate=hoje">
            <div class="indicador-rotulo">Entradas hoje</div>
            <div class="indicador-valor" id="ind-entradas-hoje">—</div>
            <div class="indicador-link">Ver as entradas →</div>
          </a>
          <a class="indicador" href="historico.html?status=finalizada&amp;campo=saida&amp;de=hoje&amp;ate=hoje">
            <div class="indicador-rotulo">Saídas hoje</div>
            <div class="indicador-valor" id="ind-saidas-hoje">—</div>
            <div class="indicador-link">Ver as saídas →</div>
          </a>
          <a class="indicador indicador-sucesso" href="financeiro.html?de=hoje&amp;ate=hoje">
            <div class="indicador-rotulo">Faturamento hoje</div>
            <div class="indicador-valor" id="ind-faturamento-hoje">—</div>
            <div class="indicador-link">Ver o financeiro →</div>
          </a>
          <a class="indicador" href="mensalistas.html">
            <div class="indicador-rotulo">Mensalistas ativos</div>
            <div class="indicador-valor" id="ind-mensalistas-ativos">—</div>
            <div class="indicador-link">Ver mensalistas →</div>
          </a>
          <a class="indicador indicador-alerta" href="vencimentos.html">
            <div class="indicador-rotulo">Vencem em 3 dias</div>
            <div class="indicador-valor" id="ind-vencem-em-breve">—</div>
            <div class="indicador-link">Ver vencimentos →</div>
          </a>
          <a class="indicador indicador-perigo" href="vencimentos.html">
            <div class="indicador-rotulo">Mensalidades vencidas</div>
            <div class="indicador-valor" id="ind-vencidas">—</div>
            <div class="indicador-link">Ver vencimentos →</div>
          </a>
        </div>
      </main>
    </div>
  </div>

  <script type="module" src="js/dashboard.js"></script>
</body>
</html>
